name: AI model tests

# The default CI runs offline (TF-IDF only) so it stays fast. This job installs the
# real sentence-transformers model, runs the tests that CI skips, and reports
# transformer accuracy. Run it manually or let the weekly schedule catch regressions.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  transformers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only PyTorch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,ai]"

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run tests including transformer tests
        env:
          SMART_ORGANIZER_DISABLE_TRANSFORMERS: "0"
        run: python -m pytest -q

      - name: Transformer accuracy report
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/evaluate_classifier.py --transformer | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
